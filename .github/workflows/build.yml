name: Build EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: python -m pip install --upgrade pip pyinstaller

    - name: List files (debug step)
      run: dir

    - name: Build EXE
      run: pyinstaller --onefile MYEXE.py

    - name: Show dist folder
      run: dir dist

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: exe-file
        path: dist/*
