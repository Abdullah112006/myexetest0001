name: Build Nuitka EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Nuitka
      run: |
        python -m pip install --upgrade pip
        pip install nuitka

    - name: Verify files
      run: dir

    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1

    - name: Build EXE
      run: |
        python -m nuitka --onefile myexe.py

    - name: Show output
      run: dir

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: exe
        path: |
          *.exe
          *.dist/**
