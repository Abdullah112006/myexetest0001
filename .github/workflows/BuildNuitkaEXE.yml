name: Build Nuitka EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Show files (debug)
      run: dir

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Upgrade pip
      run: python -m pip install --upgrade pip

    - name: Install Nuitka
      run: pip install nuitka

    - name: Install MSVC build tools
      uses: ilammy/msvc-dev-cmd@v1

    - name: Verify compiler
      run: where cl

    - name: Build EXE (Nuitka onefile)
      run: python -m nuitka --onefile --assume-yes-for-downloads myexe.py

    - name: Show output
      run: dir

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: exe-build
        path: |
          *.exe
          *.dist/**
          *.bin
